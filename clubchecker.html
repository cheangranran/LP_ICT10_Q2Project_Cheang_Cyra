<style>

@font-face {

  body {
    margin: 0;
    background-color: #17233F;
    font-family: Georgia, serif;}
    
header {
    background-image:  linear-gradient(
            rgba(16, 29, 80, 0.65),
            rgba(0, 2, 10, 0.75)
        ), url("banner.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    color: rgb(241, 234, 234);
    text-align: center;
    padding: 65px 20px;
    border-bottom: 5px linear-gradient(
            rgba(16, 29, 80, 0.65),
            rgba(0, 2, 10, 0.75)
        );
    text-shadow: 2px 2px 5px black;}

  header h1 {
    font-size: 38px;
    margin: 15px 0 10px;
    letter-spacing: 1px;}

  header p {
    font-size: 17px;
    line-height: 1.6;
    margin: 0 auto;
    }

    main {
        background-color: rgb(238, 235, 235);
        width: 80%;
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 4px 10px #0b0700; }

   main h2 {
    color: #101D50;
    margin-top: 0;
    font-size: 24px; }

    
    #first_name, #last_name {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #C5AC94;
        border-radius: 6px;
        font-size: 15px;
        box-sizing: border-box;
        background-color: #F8F5EE;
        color: #101D50;}

    #first_name:focus, #last_name:focus {
        outline: none;
        border: 2px solid #101D50;}

    #enter_button {
        background-color: #101D50;
        color: white;
        padding: 12px 30px;
        margin-top: 15px;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;}

    #enter_button:hover {
        background-color: #101D50;}


    #result {
        color: #101D50;
        margin-top: 20px;
        font-weight: bold;}

    
  footer {
    background-color: #17233F;
    color: #D8D2C5;

    padding: 20px;

    footer p {

}
